name: Mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stryker
        run: timeout 18m npx stryker run --reporters clear-text,progress,html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
